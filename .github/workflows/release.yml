name: Release

on:
  # 打 tag 发布：git tag v0.1.0 && git push --tags
  push:
    tags: ["v*"]
  # 手动触发：填一个已存在的 tag
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v0.1.0）；tag 不存在会基于当前分支自动创建"
        required: true
        type: string

# 创建 Release / 上传资产所需权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.platform }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Windows → NSIS 安装包（.exe）
          - platform: windows-latest
            rust_targets: ""
            args: ""
          # macOS → universal dmg（aarch64 + x86_64 单包）
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Linux → .deb + .AppImage（22.04 构建保证老 glibc 兼容）
          - platform: ubuntu-22.04
            rust_targets: ""
            args: ""

    steps:
      # 默认 checkout 触发 ref：tag 推送 = tag 的 commit；手动 dispatch = 分支 HEAD。
      # 不要 checkout inputs.tag —— tag 不存在时 fetch 直接失败，tag 由发 Release 时创建。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust_targets }}

      - uses: swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 自动：编译 → 前端打包 → 各平台 bundle → 创建 Release 并上传产物
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "ShiinaMashiro v__VERSION__"
          releaseBody: |
            ## v0.3.0 — 安全加固与插件宿主稳定性

            **插件安全**
            - 插件身份认证：加载时框架下发一次性 token，宿主回帧盖章校验，伪造帧一律匿名拒绝
            - Node Worker 输出流与协议管道隔离，插件写 stdout 不再污染协议
            - `/qq/ws` 事件中转端点支持 `ws_token` 鉴权
            - 定时任务只能删除自己的；插件 id 防路径穿越；MCP token 定长比较

            **稳定性**
            - 宿主进程崩溃自动重建并重放全部插件
            - JS 插件加载等待 Worker 就绪握手，入口报错不再误报成功
            - Python 入口独立线程加载，顶层阻塞不拖死宿主
            - 网关心跳看门狗自动重连僵尸连接；断线退避长会话后归零
            - 插件 API 并发调度，单个慢请求不再阻塞全部插件

            **改进**
            - 一条消息命中多个插件时单帧扇出，事件只序列化一次
            - 自动撤回改时间轮（120 槽 O(1)，上限 110 秒）
            - 修复分片上传 md5_10m、token 过期下溢、UTF-8 截断 panic、Python 中文路径乱码、@ 消息漏收等

            各平台安装包见下方 Assets：Windows `.exe`（NSIS）、macOS `.dmg`（通用包）、Linux `.deb` / `.AppImage`。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.settings.args }}
