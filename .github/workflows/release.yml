name: Release

on:
  # 打 tag 发布：git tag v0.1.0 && git push --tags
  push:
    tags: ["v*"]
  # 手动触发：填一个已存在的 tag
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v0.1.0）；tag 不存在会基于当前分支自动创建"
        required: true
        type: string

# 创建 Release / 上传资产所需权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.platform }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Windows → NSIS 安装包（.exe）
          - platform: windows-latest
            rust_targets: ""
            args: ""
            # 更新产物 glob（相对 bundle/ 目录）+ updater 平台键
            upd_glob: "nsis/*-setup.exe"
            upd_keys: "windows-x86_64"
          # macOS → universal dmg（aarch64 + x86_64 单包）
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            upd_glob: "macos/*.app.tar.gz"
            upd_keys: "darwin-aarch64 darwin-x86_64"
          # Linux → .deb + .AppImage（22.04 构建保证老 glibc 兼容）
          - platform: ubuntu-22.04
            rust_targets: ""
            args: ""
            upd_glob: "appimage/*.AppImage"
            upd_keys: "linux-x86_64"

    steps:
      # 默认 checkout 触发 ref：tag 推送 = tag 的 commit；手动 dispatch = 分支 HEAD。
      # 不要 checkout inputs.tag —— tag 不存在时 fetch 直接失败，tag 由发 Release 时创建。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust_targets }}

      - uses: swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 自动：编译 → 前端打包 → 各平台 bundle → 创建 Release 并上传产物
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥（GitHub Secrets 配置；无密码私钥直接贴内容）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "ShiinaMashiro v__VERSION__"
          releaseBody: |
            ## v0.4.1 — 更新体验打磨

            - 更新弹窗：更新日志剥掉 markdown 符号渲染为干净文本，弹窗加宽
            - 侧栏更新入口改版式：版本号居左、检查更新居右，发现新版出 new 标记
            - 修复发布流水线更新产物定位（find 递归搜索，universal 构建兼容）

            各平台安装包见下方 Assets：Windows `.exe`（NSIS）、macOS `.dmg`（通用包）、Linux `.deb` / `.AppImage`。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.settings.args }}

      # 上传本平台的更新产物 + 清单碎片到 Gitee 更新仓（并发安全：只动自己平台的文件，push 失败 rebase 重试）
      - name: Upload update artifacts to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          UPD_GLOB: ${{ matrix.settings.upd_glob }}
          UPD_KEYS: ${{ matrix.settings.upd_keys }}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ "${{ matrix.settings.platform }}" = "macos-latest" ]; then
            # universal 构建不产出 .app.tar.gz——手动把合并后的 universal .app 打包+签名当更新产物
            APP=$(find target -type d -name "*.app" -path "*universal*" | head -1)
            [ -z "$APP" ] && APP=$(find target -type d -name "*.app" | head -1)
            if [ -n "$APP" ]; then
              MAIN="ShiinaMashiro_${TAG#v}_universal.app.tar.gz"
              tar czf "$MAIN" -C "$(dirname "$APP")" "$(basename "$APP")"
              npx tauri signer sign "$MAIN" || echo "::warning::更新包签名失败"
            fi
          else
            MAIN=$(find target -path "*bundle/${UPD_GLOB}" ! -name "*.sig" | head -1)
          fi
          if [ -z "$MAIN" ] || [ ! -f "$MAIN" ]; then
            echo "::warning::未找到更新产物，本平台跳过 Gitee 同步"
            exit 0
          fi
          echo "artifact: $MAIN"
          PY=$(command -v python3 || command -v python)
          for i in 1 2 3 4 5; do
            rm -rf /tmp/smupd
            git clone -q "https://oauth2:${GITEE_TOKEN}@gitee.com/isluoxiaoxiwork/shiina-mashiro-update.git" /tmp/smupd
            # 仓默认分支是 master，更新清单走 main——clone 后显式切过去，否则 push 非快进
            git -C /tmp/smupd checkout -q main 2>/dev/null || git -C /tmp/smupd checkout -qb main origin/main
            cp "$MAIN" /tmp/smupd/
            [ -f "$MAIN.sig" ] && cp "$MAIN.sig" /tmp/smupd/
            cd /tmp/smupd
            for KEY in $UPD_KEYS; do
              "$PY" - "$KEY" "$(basename "$MAIN")" <<'PYEOF'
          import json, sys, os
          key, base = sys.argv[1], sys.argv[2]
          sig_path = base + ".sig"
          sig = open(sig_path).read().strip() if os.path.exists(sig_path) else ""
          json.dump({"signature": sig,
                     "url": f"https://gitee.com/isluoxiaoxiwork/shiina-mashiro-update/raw/main/{base}"},
                    open(f"manifest-{key}.json", "w"), indent=2)
          PYEOF
            done
            git add -A
            if git -c user.name="shiina-updater" -c user.email="updater@local" commit -qm "v${TAG} $(uname -s) artifacts"; then
              git push -q origin HEAD:main && break || true
            else
              break
            fi
            sleep 5
          done

  # 三平台全部构建完后：合并清单碎片 → 完整 latest.json（多平台分键，app 各取所需）
  gitee-manifest:
    name: Merge update manifest on Gitee
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Merge fragments and publish latest.json
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          git clone -q "https://oauth2:${GITEE_TOKEN}@gitee.com/isluoxiaoxiwork/shiina-mashiro-update.git" /tmp/smupd
          cd /tmp/smupd
          git checkout -q main 2>/dev/null || git checkout -qb main origin/main
          python3 - "$VER" <<'PY'
          import json, sys, glob, os, datetime
          ver = sys.argv[1]
          platforms = {}
          for f in sorted(glob.glob("manifest-*.json")):
              key = os.path.basename(f)[len("manifest-"):-len(".json")]
              platforms[key] = json.load(open(f))
          json.dump({
              "version": ver,
              "notes": f"ShiinaMashiro v{ver} 发布，详见 GitHub Release 说明",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": platforms,
          }, open("latest.json", "w"), ensure_ascii=False, indent=2)
          # 清理未被清单引用的旧安装包，防仓库无限膨胀
          keep = {p["url"].rsplit("/", 1)[-1] for p in platforms.values()}
          for f in glob.glob("*-setup.exe*") + glob.glob("*.app.tar.gz*") + glob.glob("*.AppImage.tar.gz*"):
              base = f[:-4] if f.endswith(".sig") else f
              if base not in keep:
                  os.remove(f)
          print(json.dumps(platforms, indent=1))
          PY
          git add -A
          git -c user.name="shiina-updater" -c user.email="updater@local" commit -qm "manifest v${VER}" || exit 0
          git push -q origin HEAD:main
