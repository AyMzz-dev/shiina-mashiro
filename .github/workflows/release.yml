name: Release

on:
  # 打 tag 发布：git tag v0.1.0 && git push --tags
  push:
    tags: ["v*"]
  # 手动触发：填一个已存在的 tag
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v0.1.0）；tag 不存在会基于当前分支自动创建"
        required: true
        type: string

# 创建 Release / 上传资产所需权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.settings.platform }}
    runs-on: ${{ matrix.settings.platform }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Windows → NSIS 安装包（.exe）
          - platform: windows-latest
            rust_targets: ""
            args: ""
          # macOS → universal dmg（aarch64 + x86_64 单包）
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Linux → .deb + .AppImage（22.04 构建保证老 glibc 兼容）
          - platform: ubuntu-22.04
            rust_targets: ""
            args: ""

    steps:
      # 默认 checkout 触发 ref：tag 推送 = tag 的 commit；手动 dispatch = 分支 HEAD。
      # 不要 checkout inputs.tag —— tag 不存在时 fetch 直接失败，tag 由发 Release 时创建。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust_targets }}

      - uses: swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 自动：编译 → 前端打包 → 各平台 bundle → 创建 Release 并上传产物
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥（GitHub Secrets 配置；无密码私钥直接贴内容）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "ShiinaMashiro v__VERSION__"
          releaseBody: |
            ## v0.5.4 — Windows 控制台窗口隐藏

            - 插件宿主（Node/Python）spawn 增加 `CREATE_NO_WINDOW`：不再随应用弹出黑色控制台窗口，也不会因误关窗口导致插件进程被杀
            - 解释器路径探测（`--version`）同样隐藏窗口
            ### 包含 v0.5.3 全部内容（网关健壮性大修）

            - **断线补发**：session_id + seq 持久化到本地，重启/升级后 Resume 仍可补回停机窗口内的事件；断线先排空事件泵再重连，收到未分发的事件不再丢
            - **假死检测**：心跳 ACK（op11）追踪 + 15s 切片看门狗，TCP 半开静默死亡两个心跳周期内即可感知并重连
            - **关闭码全量解析**：4004 刷新 token、4006/4007/9001/9005 清会话重鉴权、4914/4915 熔断停止，日志输出中文原因
            - **例行重连降噪**：官方网关每小时 OpCode 7 重连按 Info 记录并立即恢复；在线时长 30s 宽限连续累计，不再每小时清零
            - **Webhook**：签名 300s 新鲜度窗口防重放、回调异步派发防 ACK 超时；中继 /qq/ws 增加事件缓冲，Resume 真正补发断线期间事件
            - **频控防护**：Identify 5s 最小连接间隔 + session_start_limit 检查；QQ HTTP API 16 并发闸

            各平台安装包见下方 Assets：Windows `.exe`（NSIS）、macOS `.dmg`（通用包）、Linux `.deb` / `.AppImage`。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.settings.args }}
          # macOS：universal 构建不产出 .app.tar.gz——手动打包签名并传回 Release，补 darwin 更新键
      - name: Upload macOS updater artifact to Release
        if: matrix.settings.platform == 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          APP=$(find target -type d -name "*.app" -path "*universal*" | head -1)
          [ -z "$APP" ] && APP=$(find target -type d -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "::warning::未找到 .app，跳过 darwin 产物"; exit 0; fi
          MAIN="ShiinaMashiro_${TAG#v}_universal.app.tar.gz"
          tar czf "$MAIN" -C "$(dirname "$APP")" "$(basename "$APP")"
          npx tauri signer sign "$MAIN" || { echo "::warning::签名失败"; exit 0; }
          RID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          for f in "$MAIN" "$MAIN.sig"; do
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=$(basename "$f")" -o /dev/null && echo "uploaded $f"
          done

  # 三平台全部构建完：从 Release 拉 latest.json，补 darwin 键，Contents API 推到 Gitee
  # （只推几 KB 清单 JSON——大文件留 GitHub，海外→Gitee 推不动大包，实测会挂死）
  gitee-manifest:
    name: Publish latest.json to Gitee
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Publish manifest via Gitee Contents API
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          curl -sfL -o /tmp/latest.json "https://github.com/$REPO/releases/download/$TAG/latest.json"
          curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG" -o /tmp/rel.json
          python3 - <<'PY'
          import json, os, urllib.request, base64
          repo, tag = os.environ['REPO'], os.environ['TAG']
          tok, gh = os.environ['GITEE_TOKEN'], os.environ['GH_TOKEN']
          d = json.load(open('/tmp/latest.json'))
          rel = json.load(open('/tmp/rel.json'))
          names = {a['name'] for a in rel['assets']}
          appgz = next((n for n in names if n.endswith('universal.app.tar.gz')), None)
          if appgz and appgz + '.sig' in names:
              sig = urllib.request.urlopen(f'https://github.com/{repo}/releases/download/{tag}/{appgz}.sig').read().decode().strip()
              ent = {'signature': sig, 'url': f'https://github.com/{repo}/releases/download/{tag}/{appgz}'}
              d['platforms']['darwin-aarch64'] = dict(ent)
              d['platforms']['darwin-x86_64'] = dict(ent)
          # GitHub 直链套加速代理前缀（国内下载用；Gitee 附件地址不动）
          PROXY = 'https://gh-proxy.com/'
          for ent in d['platforms'].values():
              if 'gitee.com' not in ent['url']:
                  ent['url'] = PROXY + ent['url']
          data = json.dumps(d, ensure_ascii=False, indent=2).encode()
          print('platforms:', list(d['platforms']))
          api = 'https://gitee.com/api/v5/repos/isluoxiaoxiwork/shiina-mashiro-update/contents/latest.json'
          try:
              sha = json.load(urllib.request.urlopen(api + '?access_token=' + tok + '&ref=main')).get('sha')
          except Exception:
              sha = None
          form = {'access_token': tok,
                  'content': base64.b64encode(data).decode(),
                  'message': f'latest.json {tag}', 'branch': 'main'}
          if sha: form['sha'] = sha
          req = urllib.request.Request(api, data=urllib.parse.urlencode(form).encode(), method='PUT')
          print('gitee put:', urllib.request.urlopen(req).status)
          PY
